spring:
  application:
    name: native-auth

server:
  port: 8080

okhttp:
  timeout:
    connect: 30  # Connection timeout in seconds
    read: 30     # Read timeout in seconds
    write: 30    # Write timeout in seconds

entra:
  external-id:
    # Entra External ID tenant details
    tenant-subdomain: contosocustomersnativeapp
    tenant-id: db186b60-1fdd-4899-afd6-b6b2f0286f81
    client-id: bfe55ca6-7c7f-4c6e-8d29-077a3136f98c
    client-secret: oZj8Q~HTCfTlJg1eZjbDP.vjFrnC6ezb6QN2faLF  # Expires: 7/5/2026
    scope: openid profile email offline_access

    # Microsoft API URLs (can be overridden if needed)
    urls:
      native-auth-base: https://{tenantSubdomain}.ciamlogin.com/{tenantSubdomain}.onmicrosoft.com
      graph-api-base: https://graph.microsoft.com/v1.0
      graph-token-endpoint: https://login.microsoftonline.com/{tenantId}/oauth2/v2.0/token

# JWT Configuration for Hybrid Auth
jwt:
  secret: your-super-secret-key-change-this-in-production-must-be-at-least-256-bits-long-for-hs256
  issuer: tessell-iam
  token:
    lifetime:
      days: 30

# Logging
logging:
  level:
    com.tessell.entra: DEBUG
    okhttp3: DEBUG
