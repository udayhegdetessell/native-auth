plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.1'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.tessell'
version = '0.0.1-SNAPSHOT'
description = 'POC for Native Authentication in Microsoft Entra External ID'

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // HTTP Client
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // JWT for Hybrid Auth (custom token management)
    implementation 'com.auth0:java-jwt:4.4.0'

    // BCrypt for password hashing
    implementation 'org.mindrot:jbcrypt:0.4'

    // Microsoft Graph API (for user management)
    implementation 'com.microsoft.graph:microsoft-graph:6.3.0'
    implementation 'com.azure:azure-identity:1.11.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
